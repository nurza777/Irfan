# Прямые эфиры «Ирфан»: добавить в конец /etc/nginx/nginx.conf (вне http{}).
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Публиковать может только поток с секретным именем-ключом.
            # Ключ задаётся в /etc/irfan/stream.key (см. irfan-live-on.sh),
            # в репозитории его нет.
            exec_publish /usr/local/bin/irfan-live-on.sh $name;
            exec_publish_done /usr/local/bin/irfan-live-off.sh $name;

            hls on;
            hls_path /var/www/irfan-live/hls;
            hls_fragment 3s;
            hls_playlist_length 15s;
            hls_cleanup on;
        }
    }
}
