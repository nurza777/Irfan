# Раздача эфира и API курсов: добавить внутрь server{} сайта в nginx.

# Эфир (HLS + status.json) — только чтение.
location /irfan-live/ {
    alias /var/www/irfan-live/;
    add_header Cache-Control no-cache;
    add_header Access-Control-Allow-Origin *;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        application/json json;
    }
}

# API курсов: GET — всем, PUT (публикация из приложения устаза) — по паролю.
# Пароль: htpasswd -bc /etc/nginx/.irfan-htpasswd ustaz <ПАРОЛЬ>
location /irfan-api/ {
    alias /var/www/irfan-api/;
    add_header Cache-Control no-cache;
    add_header Access-Control-Allow-Origin *;
    client_max_body_size 500m;      # загрузка видео уроков

    limit_except GET {
        auth_basic "Irfan publish";
        auth_basic_user_file /etc/nginx/.irfan-htpasswd;
    }
    dav_methods PUT;
    create_full_put_path on;
}
