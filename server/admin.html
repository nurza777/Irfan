<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ирфан — админка</title>
<!--
  Веб-панель администратора. Один файл, без сборки и внешних библиотек:
  отдаётся тем же apiserver.py, поэтому открывается по IP из любого браузера
  и не упирается в CORS.

  Пароль хранится только в sessionStorage — закрыли вкладку, и он исчез.

  Защищённый вход — по ссылке Tailscale Funnel:
      https://irfan-server.tailff3502.ts.net/admin.html
  Там настоящий сертификат, выпущенный на этот же сервер.

  Прямой адрес http://178.104.206.100:8090/admin.html тоже работает, но
  пароль по нему идёт открытым текстом — только из доверенной сети.
-->
<style>
  :root {
    --bg: #0b1622; --card: #14212f; --line: #23364a;
    --ink: #eaf1f8; --muted: #8fa6bd;
    --gold: #e0c071; --green: #2ea36a; --red: #e0555a; --orange: #e0a355;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--gold); }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: #1b2a3b; color: var(--ink); padding: 9px 14px;
  }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.danger { background: transparent; border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .5; cursor: default; }
  input, select {
    font: inherit; background: #0d1925; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: #0e1b28;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .sp { flex: 1; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button.on { background: var(--gold); border-color: var(--gold); color: #16232f; font-weight: 700; }

  main { padding: 20px; max-width: 1180px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .kpis { display: flex; gap: 18px; flex-wrap: wrap; }
  .kpi b { display: block; font-size: 27px; }
  .kpi span { font-size: 12px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr.row:hover { background: #182837; cursor: pointer; }

  .bar { display: flex; align-items: center; gap: 10px; margin: 5px 0; font-size: 13px; }
  .bar .lbl { width: 108px; color: var(--muted); flex: none; }
  .bar .track { flex: 1; height: 8px; background: #0d1925; border-radius: 4px; overflow: hidden; }
  /* span по умолчанию inline — высота игнорируется, полоса не рисуется. */
  .bar .fill { display: block; height: 100%; background: var(--gold); }
  .bar .val { width: 86px; text-align: right; flex: none; }

  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; }
  .tag.ok { background: rgba(46,163,106,.2); color: var(--green); }
  .tag.warn { background: rgba(224,163,85,.2); color: var(--orange); }
  .tag.bad { background: rgba(224,85,90,.2); color: var(--red); }

  dialog {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; max-width: 640px; width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }

  #login { max-width: 380px; margin: 12vh auto; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #1b2a3b; border: 1px solid var(--gold); border-radius: 10px;
    padding: 11px 18px; display: none; z-index: 20; max-width: 90%;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chips button.on { background: var(--gold); border-color: var(--gold); color: #16232f; font-weight: 700; }
  .chips .cnt { opacity: .7; font-size: 12px; }
  /* Плеер: широкий диалог, видео по ширине окна и не выше экрана. */
  dialog.wide { max-width: 900px; }
  dialog video, dialog img { width: 100%; max-height: 68vh; border-radius: 10px; background: #000; }
  td.sel { width: 30px; }
  td.sel input { width: 16px; height: 16px; }
  /* Кадр из ролика: двести файлов с именами tajweed-38.mp4 иначе не различить. */
  td.thumb { width: 128px; }
  td.thumb img {
    width: 112px; height: 63px; object-fit: cover; display: block;
    border-radius: 8px; background: #0d1925; cursor: pointer;
  }
</style>
</head>
<body>

<div id="login" class="card" hidden>
  <h2>Вход в админку «Ирфан»</h2>
  <p class="muted">Учётная запись администратора сервера.</p>
  <label>Логин</label>
  <input id="lg-user" value="admin" autocomplete="username">
  <label>Пароль</label>
  <input id="lg-pass" type="password" autocomplete="current-password">
  <p id="lg-err" class="muted" style="color:var(--red)"></p>
  <p style="margin-top:14px"><button class="primary" id="lg-go" style="width:100%">Войти</button></p>
  <p class="muted" style="margin-top:14px" id="lg-note"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Ирфан · админка</h1>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <span class="muted" id="who"></span>
    <button id="reload">Обновить</button>
    <button id="logout">Выйти</button>
  </header>
  <main id="view"></main>
</div>

<div id="toast"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';

// ——— Доступ к API ———————————————————————————————————————————————

const API = location.origin;            // панель отдаётся тем же сервером
let auth = sessionStorage.getItem('irfan_auth') || '';

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Authorization': 'Basic ' + auth, ...(opts.headers || {}) },
  });
  if (r.status === 401) { logout(); throw new Error('Нет прав'); }
  return r;
}

async function getJson(path, fallback) {
  try {
    const r = await api(path);
    if (!r.ok) return fallback;
    return await r.json();
  } catch { return fallback; }
}

async function postJson(path, body) {
  const r = await api(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.ok ? null : `Сервер ответил ${r.status}`;
}

/// Как postJson, но возвращает текст ошибки от сервера: на учётках он
/// осмысленный («логин занят», «пароль — минимум 8 символов»).
async function staffOp(body) {
  const r = await api('/staff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (r.ok) return null;
  const j = await r.json().catch(() => null);
  return j?.error || `Сервер ответил ${r.status}`;
}

async function putJson(path, body) {
  const r = await api(path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body, null, 2),
  });
  return r.ok ? null : `Сервер ответил ${r.status}`;
}

// ——— Мелкие помощники ———————————————————————————————————————————

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.style.display = 'none'), 2600);
}

const fmtDate = (ms) => ms
  ? new Date(ms).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' })
  : '—';
const fmtDateTime = (ms) => ms
  ? new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
  : '—';

function bar(label, count, total, color) {
  const pct = total ? Math.round((count / total) * 100) : 0;
  return `<div class="bar">
    <span class="lbl">${esc(label)}</span>
    <span class="track"><span class="fill" style="width:${pct}%;background:${color || 'var(--gold)'}"></span></span>
    <span class="val">${count} · ${pct}%</span>
  </div>`;
}

const fmtBytes = (b) => b >= 1 << 30 ? (b / 2 ** 30).toFixed(1) + ' ГБ'
  : b >= 1 << 20 ? (b / 2 ** 20).toFixed(1) + ' МБ'
  : (b / 1024).toFixed(0) + ' КБ';

/// Загрузка файла с прогрессом. fetch не показывает ход отправки, поэтому XHR.
function uploadFile(file, name, onProgress, folder) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    // Папку передаём сразу при загрузке: имя на сервере может измениться
    // (кириллица → латиница), и разложить файл вторым запросом было бы не по чему.
    // Подписью по умолчанию берём исходное имя без расширения: на диске оно
    // всё равно станет латиницей («Урок 1 — Омовение.mp4» → Urok-1-Omovenie.mp4),
    // и без подписи файл потом не опознать.
    const q = new URLSearchParams();
    if (folder) q.set('folder', folder);
    q.set('title', name.replace(/\.[^.]+$/, ''));
    xhr.open('PUT', API + '/uploads/' + encodeURIComponent(name) + '?' + q);
    xhr.setRequestHeader('Authorization', 'Basic ' + auth);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress(e.loaded / e.total);
    };
    xhr.onload = () => resolve(
      xhr.status === 201 ? null
        : xhr.status === 415 ? 'Такой тип файла загружать нельзя'
        : `Сервер ответил ${xhr.status}`);
    xhr.onerror = () => resolve('Не удалось загрузить — проверьте связь');
    xhr.send(file);
  });
}

function dialog(html) {
  const d = $('#dlg');
  d.innerHTML = html;
  d.showModal();
  return d;
}

// ——— Состояние ——————————————————————————————————————————————————

const state = {
  users: [], access: [], codes: [], catalog: [], pending: {},
  media: [], mediaFolders: [], disk: {}, author: '',
  // Какая папка открыта в разделе «Видео»: '*' — все файлы, '' — без папки,
  // иначе id папки.
  mediaFolder: '*',
  // Публичный адрес сервера для ссылок на уроки. Панель могут открыть по
  // защищённой ссылке Tailscale — складывать ссылку из адреса админа нельзя,
  // иначе ученикам достанется адрес служебного канала.
  mediaBase: '',
  // Устазы: реестр и заявки на каталог (у каждого своя).
  teachers: [],
  // Учётки для входа устаза в приложение (логин + пароль, заводит админ).
  staff: [],
  // Сбои приложения, сгруппированные по виду ошибки.
  crashes: [],
  // Контакт, который приложение показывает ученику на экране подтверждения
  // номера: коды выдаёт человек, и без контакта фраза «попросите код у
  // устаза» никуда не ведёт.
  support: {},
  coursesRaw: {},
  teacherId: '',
  pendingCourses: [],
  // Выданные дипломы и сертификаты плюс настраиваемый список поводов
  // (модулей и программ) — их правит админ здесь же.
  certs: [],
  certModules: [],
  // Кого отметили галочками для выдачи. Живёт отдельно от разметки: поиск
  // прячет строки, а не перерисовывает список, иначе отметки слетали бы.
  certPick: new Set(),
};

async function loadAll() {
  const [users, access, codes, courses, media, teachers, queue, pn, pa, staff,
         crashes, support, certs, certModules] =
    await Promise.all([
      getJson('/users.json', []),
      getJson('/access.json', []),
      getJson('/verifications.json', []),
      getJson('/courses.json', { directions: [] }),
      getJson('/media.json', { items: [], disk: {} }),
      getJson('/teachers.json', { teachers: [] }),
      getJson('/pending.json', { pending: [] }),
      getJson('/news_pending.json', null),
      getJson('/azkar_pending.json', null),
      getJson('/staff.json', { staff: [] }),
      getJson('/crashes.json', []),
      getJson('/support.json', {}),
      getJson('/certificates.json', { items: [] }),
      getJson('/cert_modules.json', { items: [] }),
    ]);
  state.support = (support && typeof support === 'object') ? support : {};
  // Свежие сверху: последняя выдача — та, к которой чаще возвращаются.
  state.certs = (Array.isArray(certs?.items) ? certs.items : [])
    .slice().sort((a, b) => (b.issuedAt || 0) - (a.issuedAt || 0));
  state.certModules = Array.isArray(certModules?.items) ? certModules.items : [];
  state.teachers = teachers?.teachers || [];
  state.staff = staff?.staff || [];
  // Свежие сверху: чинить надо то, что падает сейчас.
  state.crashes = (Array.isArray(crashes) ? crashes : [])
    .slice().sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
  state.coursesRaw = courses || {};
  // Полные заявки — по файлу на устаза; список выше даёт только сводку.
  state.pendingCourses = (await Promise.all(
    (queue?.pending || []).map((s) =>
      getJson(`/courses_pending_${s.teacherId}.json`, null)
        .then((p) => (p ? { ...p, teacherId: s.teacherId } : null))),
  )).filter(Boolean);
  state.users = Array.isArray(users) ? users : [];
  state.access = Array.isArray(access) ? access : [];
  state.codes = (Array.isArray(codes) ? codes : []).slice().reverse();
  // Выбранный устаз: сохраняем прежний, если он ещё есть.
  const blocks = teacherBlocks();
  if (!blocks.some((b) => b.id === state.teacherId)) {
    state.teacherId = blocks.length ? blocks[0].id : '';
  }
  const cur = blocks.find((b) => b.id === state.teacherId);
  state.catalog = cur ? (cur.directions || []) : [];
  state.author = cur ? (cur.name || '') : '';
  state.media = media?.items || [];
  state.mediaFolders = media?.folders || [];
  state.disk = media?.disk || {};
  // Папку могли удалить в другой вкладке — не оставляем панель в пустоте.
  if (state.mediaFolder !== '*' && state.mediaFolder !== ''
      && !state.mediaFolders.some((f) => f.id === state.mediaFolder)) {
    state.mediaFolder = '*';
  }
  state.mediaBase = media?.mediaBase || API;
  state.pending = { news: pn, azkar: pa };
}

/// Блоки каталога: по одному на устаза. Каталог прежнего вида (author +
/// directions на верхнем уровне) показываем как блок «legacy» — иначе уроки,
/// опубликованные до появления реестра, пропали бы из редактора.
function teacherBlocks() {
  const raw = state.coursesRaw || {};
  const blocks = Array.isArray(raw.teachers)
    ? raw.teachers.map((b) => ({ ...b }))
    : [];
  if (Array.isArray(raw.directions) && raw.directions.length) {
    blocks.push({
      id: 'legacy',
      name: raw.author || 'Устаз',
      directions: raw.directions,
    });
  }
  // Одобренные устазы без уроков тоже нужны: им как раз и надо что-то завести.
  for (const t of state.teachers) {
    if (t.status === 'approved' && !blocks.some((b) => b.id === t.id)) {
      blocks.push({ id: t.id, name: t.name || 'Устаз', directions: [] });
    }
  }
  return blocks;
}

const teacherName = (id) =>
  (teacherBlocks().find((b) => b.id === id) || {}).name || 'Устаз';

/// Опознаватель студента — номер телефона. Поле email встречается только
/// у записей, заведённых до перехода на номера.
const identOf = (u) => u.phone || u.email || '';
const activeGrants = (id) => state.access.filter((g) =>
  (g.student ?? g.email) === id && !g.revoked
  && (g.until == null || g.until > Date.now()));

// ——— Разделы ————————————————————————————————————————————————————

const TABS = [
  ['stats', 'Статистика', viewStats],
  ['users', 'Ученики', viewUsers],
  ['teachers', 'Устазы', viewTeachers],
  ['courses', 'Курсы', viewCourses],
  ['media', 'Видео', viewMedia],
  ['access', 'Доступы', viewAccess],
  ['certs', 'Сертификаты', viewCerts],
  ['codes', 'Коды', viewCodes],
  ['moderation', 'Модерация', viewModeration],
  ['crashes', 'Сбои', viewCrashes],
];
let tab = 'stats';

function render() {
  const waiting = waitingCodes();
  $('#nav').innerHTML = TABS
    .map(([id, title]) => {
      // Ученик ждёт, пока код назовут вслух. Счётчик прямо в меню — чтобы это
      // было видно из любого раздела, а не только когда открыт нужный.
      const badge = (id === 'codes' && waiting) ? ` (${waiting})` : '';
      return `<button data-tab="${id}" class="${id === tab ? 'on' : ''}">${title}${badge}</button>`;
    })
    .join('');
  $('#nav').querySelectorAll('button').forEach((b) =>
    (b.onclick = () => { tab = b.dataset.tab; render(); }));
  $('#view').innerHTML = (TABS.find(([id]) => id === tab) || TABS[0])[2]();
  wire();
  watchCodes();
}

/// Пока открыт раздел «Коды», панель перечитывает данные сама.
///
/// Обновлять всё подряд по таймеру нельзя: в «Курсах» и «Видео» это стирало
/// бы наполовину заполненную форму под руками. А здесь смотреть не на что,
/// кроме как на новые запросы, и нажимать «Обновить» вслепую — то же самое
/// ожидание, только руками.
let codesTimer = null;

function watchCodes() {
  clearInterval(codesTimer);
  if (tab !== 'codes') return;
  codesTimer = setInterval(async () => {
    if (tab !== 'codes' || document.hidden) return;
    // Форма контакта могла быть уже заполнена — сохраняем введённое.
    const draft = $('#sp-wa') ? {
      whatsapp: $('#sp-wa').value,
      telegram: $('#sp-tg').value,
      note: $('#sp-note').value,
    } : null;
    await loadAll();
    if (draft) state.support = { ...state.support, ...draft };
    render();
  }, 20000);
}

// — Статистика

function viewStats() {
  const u = state.users;
  const total = u.length;
  if (!total) return `<div class="card"><p class="muted">Пока никто не зарегистрировался.</p></div>`;

  const men = u.filter((x) => x.gender === 'male').length;
  const women = u.filter((x) => x.gender === 'female').length;
  const noGender = total - men - women;
  const verified = u.filter((x) => x.verified).length;
  const blocked = u.filter((x) => x.blocked).length;
  const week = Date.now() - 7 * 864e5;
  const active = u.filter((x) => (x.lastSeen || 0) > week).length;

  // Возраст считаем только по указавшим — иначе среднее врёт.
  const withAge = u.filter((x) => (x.age || 0) > 0);
  const avgAge = withAge.length
    ? Math.round(withAge.reduce((s, x) => s + x.age, 0) / withAge.length) : 0;
  const groups = [
    ['до 18', withAge.filter((x) => x.age < 18).length],
    ['18–25', withAge.filter((x) => x.age >= 18 && x.age <= 25).length],
    ['26–35', withAge.filter((x) => x.age >= 26 && x.age <= 35).length],
    ['36–50', withAge.filter((x) => x.age >= 36 && x.age <= 50).length],
    ['50+', withAge.filter((x) => x.age > 50).length],
  ];

  const cities = {};
  u.forEach((x) => { if (x.city) cities[x.city] = (cities[x.city] || 0) + 1; });
  const topCities = Object.entries(cities).sort((a, b) => b[1] - a[1]).slice(0, 10);

  const prayers = u.reduce((s, x) => s + (x.prayersRead || 0), 0);
  const bestStreak = u.reduce((s, x) => Math.max(s, x.streak || 0), 0);

  return `
  <div class="card">
    <h2>Всего учеников</h2>
    <div class="kpis">
      <div class="kpi"><b>${total}</b><span>всего</span></div>
      <div class="kpi"><b>${active}</b><span>активны за неделю</span></div>
      <div class="kpi"><b>${verified}</b><span>подтвердили телефон</span></div>
      <div class="kpi"><b>${prayers}</b><span>намазов всего</span></div>
      <div class="kpi"><b>${bestStreak}</b><span>лучшая серия</span></div>
      ${blocked ? `<div class="kpi"><b style="color:var(--red)">${blocked}</b><span>заблокировано</span></div>` : ''}
    </div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Мужчины и женщины</h2>
      ${bar('Мужчины', men, total, '#5aa9e6')}
      ${bar('Женщины', women, total, '#e668a0')}
      ${noGender ? bar('Не указан', noGender, total, '#5c7185') : ''}
    </div>
    <div class="card">
      <h2>Возраст</h2>
      ${withAge.length ? `
        <div class="kpis" style="margin-bottom:10px">
          <div class="kpi"><b>${avgAge}</b><span>средний возраст</span></div>
          <div class="kpi"><b>${withAge.length}</b><span>указали возраст</span></div>
        </div>

}

function viewUsers() {
  return `
  <div class="card">
    <h2>Ученики (${state.users.length})</h2>

function usersTable(query = '') {
  const q = query.trim().toLowerCase();
  const rows = state.users.filter((u) => !q ||
    [u.name, u.phone, u.email, u.city].some((v) => (v || '').toLowerCase().includes(q)));
  if (!rows.length) return '<p class="muted">Ничего не найдено.</p>';
  return `<table><thead><tr>
      <th>Имя</th><th>Телефон</th><th>Пол / возраст</th>
      <th>Намазы</th><th>Серия</th><th>Баланс</th><th>Доступы</th><th></th>
    </tr></thead><tbody>
    ${rows.map((u) => {
      const id = identOf(u);
      const g = activeGrants(id).length;
      return `<tr class="row" data-id="${esc(id)}">
        <td><b>${esc(u.name || '—')}</b>${u.blocked ? ' <span class="tag bad">блок</span>' : ''}</td>
        <td><b>${esc(u.phone || u.email || '—')}</b>
          ${u.phone ? (u.verified ? '<span class="tag ok">✓</span>' : '<span class="tag warn">не подтв.</span>') : ''}</td>
        <td>${u.gender === 'male' ? 'муж' : u.gender === 'female' ? 'жен' : '—'} ·
            ${u.age || '—'}<br><span class="muted">${esc(u.city || '')}</span></td>
        <td>${u.prayersRead || 0}</td>
        <td>${u.streak || 0}</td>
        <td>${u.balance ?? 0}</td>
        <td>${g ? `<span class="tag ok">${g}</span>` : '<span class="muted">нет</span>'}</td>
        <td>›</td>
      </tr>`;
    }).join('')}
  </tbody></table>`;
}

function openStudent(id) {
  const u = state.users.find((x) => identOf(x) === id);
  if (!u) return;
  const email = id;                       // ключ для запросов к серверу
  const grants = activeGrants(id);
  const fromPrayers = (u.prayersRead || 0) * 5;
  const fromZikr = Math.max(0, (u.coins || 0) - fromPrayers);

  dialog(`
    <h2 style="margin:0 0 4px">${esc(u.name || '—')}</h2>
    <p class="muted" style="margin:0 0 14px">${esc(u.phone || u.email || '')}</p>

    <div class="card" style="margin:0 0 12px">
      <h2>Анкета</h2>
      <table>
        <tr><td class="muted">Номер</td><td>${esc(u.phone || u.email || 'не указан')}
          ${u.phone ? (u.verified ? '<span class="tag ok">подтверждён</span>' : '<span class="tag warn">не подтверждён</span>') : ''}</td></tr>
        <tr><td class="muted">Город</td><td>${esc(u.city || 'не указан')}</td></tr>
        <tr><td class="muted">Пол</td><td>${u.gender === 'male' ? 'мужской' : u.gender === 'female' ? 'женский' : 'не указан'}</td></tr>
        <tr><td class="muted">Возраст</td><td>${u.age || 'не указан'}</td></tr>
        <tr><td class="muted">Регистрация</td><td>${fmtDate(u.registeredAt)}</td></tr>
        <tr><td class="muted">Последний вход</td><td>${fmtDate(u.lastSeen)}</td></tr>
      </table>
    </div>

    <div class="card" style="margin:0 0 12px">
      <h2>Эффективность</h2>
      <div class="kpis">
        <div class="kpi"><b>${u.prayersRead || 0}</b><span>намазов</span></div>
        <div class="kpi"><b>${u.streak || 0}</b><span>дней подряд</span></div>
        <div class="kpi"><b>${fromZikr}</b><span>коинов за зикры</span></div>
        <div class="kpi"><b>${u.balance ?? 0}</b><span>баланс</span></div>
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <h2>Доступ к обучению</h2>
      ${grants.length ? `<table><tbody>${grants.map((g) => `
        <tr><td>${g.scope === 'direction' ? '📁' : '▶️'} ${esc(g.key)}</td>
            <td class="muted">${g.until == null ? 'бессрочно' : 'до ' + fmtDate(g.until)}</td>
            <td><button class="danger" data-revoke="${esc(g.scope)}|${esc(g.key)}">Закрыть</button></td></tr>`).join('')}
        </tbody></table>` : '<p class="muted">Доступ пока не выдан.</p>'}
      <div style="margin-top:12px">
        <label>Открыть доступ</label>
        <select id="gr-key">
          ${state.catalog.map((d) => `
            <option value="direction|${esc(d.title)}">📁 ${esc(d.title)} — всё направление</option>
            ${(d.courses || []).map((c) => `<option value="course|${esc(d.title)}/${esc(c.title)}">▶️ ${esc(d.title)} / ${esc(c.title)}</option>`).join('')}
          `).join('') || '<option value="">Каталог курсов пуст</option>'}
        </select>
        <label>Срок</label>
        <select id="gr-days">
          <option value="7">7 дней</option>
          <option value="30" selected>1 месяц</option>
          <option value="90">3 месяца</option>
          <option value="180">6 месяцев</option>
          <option value="365">1 год</option>
          <option value="0">Бессрочно</option>
          <option value="custom">Свой срок…</option>
        </select>
        <input id="gr-custom" type="number" min="1" placeholder="дней" style="margin-top:8px" hidden>
        <p><button class="primary" id="gr-go" style="width:100%;margin-top:10px">Выдать доступ</button></p>
      </div>
    </div>

    <div class="row-actions">
      <button id="st-block">${u.blocked ? 'Разблокировать' : 'Заблокировать'}</button>
      <button class="danger" id="st-del">Удалить из реестра</button>
      <span class="sp" style="flex:1"></span>
      <button id="st-close">Закрыть</button>
    </div>
  `);

  $('#st-close').onclick = () => $('#dlg').close();

  $('#gr-days').onchange = (e) =>
    ($('#gr-custom').hidden = e.target.value !== 'custom');

  $('#gr-go').onclick = async () => {
    const raw = $('#gr-key').value;
    if (!raw) return toast('Каталог курсов пуст');
    const [scope, ...rest] = raw.split('|');
    const sel = $('#gr-days').value;
    const days = sel === 'custom' ? parseInt($('#gr-custom').value || '0', 10) : parseInt(sel, 10);
    const err = await postJson('/access/grant',
      { phone: email, scope, key: rest.join('|'), days: days || 0 });
    toast(err || 'Доступ выдан');
    if (!err) { await loadAll(); $('#dlg').close(); render(); }
  };

  document.querySelectorAll('[data-revoke]').forEach((b) => (b.onclick = async () => {
    const [scope, ...rest] = b.dataset.revoke.split('|');
    const err = await postJson('/access/revoke', { phone: email, scope, key: rest.join('|') });
    toast(err || 'Доступ закрыт');
    if (!err) { await loadAll(); $('#dlg').close(); render(); }
  }));

  // Точечные операции вместо перезаписи всего users.json: пока админ
  // смотрит на список, ученики отмечаются и регистрируются, и запись
  // поверх старым снимком стирала бы их активность.
  $('#st-block').onclick = async () => {
    const err = await postJson('/users/flag',
      { phone: email, blocked: !u.blocked });
    toast(err || (!u.blocked ? 'Доступ заблокирован' : 'Доступ восстановлен'));
    await loadAll();
    $('#dlg').close(); render();
  };

  $('#st-del').onclick = async () => {
    if (!confirm(`Удалить «${u.name}» из реестра? Аккаунт на устройстве останется.`)) return;
    const err = await postJson('/users/delete', { phone: email });
    toast(err || 'Удалён из реестра');
    await loadAll();
    $('#dlg').close(); render();
  };
}

// — Сертификаты и дипломы
//
// Выдаёт только админ и только руками: прогресс уроков живёт на телефоне
// ученика, а «досмотрел ролик» и «сдал модуль» — разные вещи. Поводы
// (модули, программы) настраиваются здесь же, внизу раздела: модулей может
// стать пять, а программ три, и ради этого не нужно трогать код.

const CERT_TEMPLATES = [
  ['diploma', 'Диплом'],
  ['certificate', 'Сертификат'],
  ['gift', 'Подарочный'],
];
const CERT_LANGS = [['ru', 'Русский'], ['ky', 'Кыргызча']];

const certTplName = (t) =>
  (CERT_TEMPLATES.find(([id]) => id === t) || [null, t || '—'])[1];

/// Обращение на бланке: в русских образцах оно зависит от пола, в
/// кыргызских — одно на всех («УРМАТТУУ»).
const certSalute = (gender, lang) => lang === 'ky'
  ? 'УРМАТТУУ'
  : (gender === 'female' ? 'УВАЖАЕМАЯ' : 'УВАЖАЕМЫЙ');

/// Уже выданное этому ученику — чтобы при выдаче было видно, кому повторять
/// не нужно.
const certsOf = (id) =>
  state.certs.filter((c) => c.student === id && c.status === 'issued');

function viewCerts() {
  const mods = state.certModules;
  const today = new Date().toISOString().slice(0, 10);
  const teacher = state.author || '';

  const issue = `<div class="card">
    <h2>Выдать</h2>
    <div class="grid" style="gap:10px">
      <label>Повод<br><select id="c-mod">
        <option value="">— свой текст —</option>

      </select></label>
      <label>Бланк<br><select id="c-tpl">
        ${CERT_TEMPLATES.map(([id, t]) =>
          `<option value="${id}">${t}</option>`).join('')}
      </select></label>
      <label>Язык<br><select id="c-lang">

    </div>
    <label>Текст повода (встанет на бланк)<br>

    <div class="grid" style="gap:10px;margin-top:8px">

      <label>Устаз<br><input id="c-teacher" value="${esc(teacher)}"></label>
      <label id="c-gift-wrap" style="display:none">Подарок от<br>
        <input id="c-gift" placeholder="Жунусов Нурсултандан"></label>
    </div>
    <p class="muted" id="c-preview" style="margin:10px 0 0"></p>

    <div class="bar" style="margin-top:14px">
      <input id="c-q" placeholder="Поиск ученика" style="flex:1">
      <button id="c-all">Отметить видимых</button>
      <button id="c-none">Снять отметки</button>
    </div>
    <table><thead><tr><th></th><th>Имя на бланке</th><th>Телефон</th>

    <button id="c-issue" style="margin-top:12px">Выдать отмеченным (0)</button>

  const registry = `<div class="card">
    <h2>Выданные (${state.certs.length})</h2>
    ${state.certs.length ? `
    <input id="c-rq" placeholder="Поиск по номеру, имени или поводу"
           style="width:100%;margin-bottom:10px">
    <table><thead><tr><th>Номер</th><th>Кому</th><th>Что</th><th>Дата</th>
      <th>Статус</th><th></th></tr></thead>
      <tbody id="c-reg">${certRegistryRows('')}</tbody></table>`
    : '<p class="muted">Пока ничего не выдано.</p>'}
  </div>`;

  const modules = `<div class="card">
    <h2>Модули и программы</h2>
    <p class="muted">Из этого списка выбирается повод при выдаче. Текст
      подставляется в бланк на выбранном языке; если кыргызского нет, встанет
      русский. Правка списка не меняет уже выданные документы.</p>
    <table><thead><tr><th>Название (для панели)</th><th>Бланк</th>
      <th>Текст по-русски</th><th>Текст по-кыргызски</th><th></th></tr></thead>
      <tbody id="c-mods">${(mods.length ? mods : [{}]).map(certModuleRow).join('')}</tbody></table>
    <div class="bar" style="margin-top:10px">
      <button id="c-mod-add">Добавить строку</button>

  return issue + registry + modules;
}

/// Строка ученика в списке выдачи. Имя — поле ввода: ученик писал его сам
/// при регистрации, бывает строчными и с опечаткой, а на бланке оно должно
/// стоять так, как решил админ.
function certStudentRows(q) {
  const needle = (q || '').trim().toLowerCase();
  return state.users
    .filter((u) => !u.blocked)
    .map((u) => {
      const id = identOf(u);
      const has = certsOf(id);
      const hay = `${u.name || ''} ${id} ${u.city || ''}`.toLowerCase();
      const hide = needle && !hay.includes(needle);
      return `<tr class="c-row" data-id="${esc(id)}"${hide ? ' style="display:none"' : ''}>
        <td><input type="checkbox" class="c-pick" data-id="${esc(id)}"
             ${state.certPick.has(id) ? 'checked' : ''}></td>
        <td><input class="c-name" data-id="${esc(id)}" value="${esc(u.name || '')}"
             style="width:100%"></td>
        <td class="muted">${esc(id)}</td>
        <td>${has.length
          ? has.map((c) => `<span class="tag">${esc(certTplName(c.template))}</span>`).join(' ')
          : '<span class="muted">—</span>'}</td>
      </tr>`;
    }).join('');
}

function certRegistryRows(q) {
  const needle = (q || '').trim().toLowerCase();
  return state.certs.map((c) => {
    const hay = `${c.number} ${c.name} ${c.title} ${c.course || ''}`.toLowerCase();
    const hide = needle && !hay.includes(needle);
    const revoked = c.status === 'revoked';
    return `<tr${hide ? ' style="display:none"' : ''}>
      <td><code>${esc(c.number)}</code></td>
      <td>${esc(c.name)}<br><span class="muted">${esc(c.student || '')}</span></td>
      <td>${esc(certTplName(c.template))} · ${esc(c.lang === 'ky' ? 'кы' : 'ру')}<br>
          <span class="muted">${esc(c.title)}</span></td>
      <td class="muted">${fmtDate(c.issuedAt)}</td>
      <td>${revoked ? '<span class="tag bad">отозван</span>'
                    : '<span class="tag ok">действует</span>'}</td>
      <td class="row-actions">
        <button data-cedit="${esc(c.number)}">Править</button>
        <button data-crev="${esc(c.number)}">${revoked ? 'Вернуть' : 'Отозвать'}</button>
        <button class="danger" data-cdel="${esc(c.number)}">Удалить</button>
      </td></tr>`;
  }).join('');
}

function certModuleRow(m) {
  return `<tr class="c-mod-row">
    <td><input class="cm-label" value="${esc(m.label || '')}" placeholder="Модуль 1"></td>
    <td><select class="cm-tpl">${CERT_TEMPLATES.map(([id, t]) =>
      `<option value="${id}"${(m.template || 'diploma') === id ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
    <td><input class="cm-ru" value="${esc(m.ru || '')}" style="width:100%"
        placeholder="первого модуля по чтению Корана"></td>
    <td><input class="cm-ky" value="${esc(m.ky || '')}" style="width:100%"
        placeholder="Куран окуу боюнча биринчи модулду"></td>
    <td><button class="danger cm-del">×</button></td>
  </tr>`;
}

function wireCerts() {
  if (!$('#c-issue')) return;
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  const preview = () => {
    const tpl = $('#c-tpl').value;
    const lang = $('#c-lang').value;
    const title = $('#c-title').value.trim();
    $('#c-gift-wrap').style.display = tpl === 'gift' ? '' : 'none';
    $('#c-preview').textContent = title
      ? `${certTplName(tpl)} · ${certSalute('male', lang)}/${certSalute('female', lang)} · «${title}»`
      : 'Выберите повод или впишите текст — он встанет на бланк.';
  };

  // Повод — главный выбор: за ним следом встают бланк и текст, чтобы не
  // выбирать одно и то же дважды и не путать диплом с сертификатом.
  $('#c-mod').onchange = () => {
    const m = state.certModules.find((x) => x.id === $('#c-mod').value);
    if (!m) { preview(); return; }
    $('#c-tpl').value = m.template || 'diploma';
    const lang = $('#c-lang').value;
    $('#c-title').value = (lang === 'ky' ? (m.ky || m.ru) : m.ru) || '';
    preview();
  };
  $('#c-lang').onchange = () => { $('#c-mod').onchange(); };
  $('#c-tpl').onchange = preview;
  $('#c-title').oninput = preview;
  preview();

  const countBtn = () => {
    $('#c-issue').textContent = `Выдать отмеченным (${state.certPick.size})`;
  };
  const bindPicks = () => {
    $$('.c-pick').forEach((el) => (el.onchange = () => {
      if (el.checked) state.certPick.add(el.dataset.id);
      else state.certPick.delete(el.dataset.id);
      countBtn();
    }));
  };
  bindPicks();
  countBtn();

  // Поиск прячет строки, а не перерисовывает список: иначе слетали бы
  // отметки и вписанные имена.
  $('#c-q').oninput = () => {
    const needle = $('#c-q').value.trim().toLowerCase();
    $$('#c-list tr.c-row').forEach((tr) => {
      const name = tr.querySelector('.c-name')?.value || '';
      const hay = `${name} ${tr.dataset.id}`.toLowerCase();
      tr.style.display = (!needle || hay.includes(needle)) ? '' : 'none';
    });
  };
  $('#c-all').onclick = () => {
    $$('#c-list tr.c-row').forEach((tr) => {
      if (tr.style.display === 'none') return;
      const box = tr.querySelector('.c-pick');
      box.checked = true;
      state.certPick.add(box.dataset.id);
    });
    countBtn();
  };
  $('#c-none').onclick = () => {
    state.certPick.clear();
    $$('.c-pick').forEach((b) => (b.checked = false));
    countBtn();
  };

  $('#c-issue').onclick = async () => {
    if (!state.certPick.size) { toast('Никто не отмечен'); return; }
    const title = $('#c-title').value.trim();
    if (!title) { toast('Впишите текст повода'); return; }
    const names = {};
    $$('.c-name').forEach((el) => (names[el.dataset.id] = el.value.trim()));
    const students = Array.from(state.certPick)
      .map((id) => ({ phone: id, name: names[id] || '' }));
    const date = $('#c-date').value;
    const r = await api('/certificates/issue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        template: $('#c-tpl').value,
        lang: $('#c-lang').value,
        moduleId: $('#c-mod').value,
        title,
        course: $('#c-course').value.trim(),
        teacher: $('#c-teacher').value.trim(),
        giftFrom: $('#c-gift') ? $('#c-gift').value.trim() : '',
        issuedAt: date ? Date.parse(date + 'T12:00:00') : 0,
        students,
      }),
    });
    const body = await r.json().catch(() => null);
    if (!r.ok) { toast(body?.error || `Сервер ответил ${r.status}`); return; }
    const done = body.issued.length;
    const skipped = body.skipped.length;
    // Пропущенных называем поимённо: чаще всего это «уже выдан такой же»,
    // и молчаливое «выдано 18 из 20» оставляло бы гадать, кому не досталось.
    toast(`Выдано: ${done}${skipped ? `, пропущено: ${skipped}` : ''}`);
    state.certPick.clear();
    await loadAll();
    render();
  };

  // — Реестр
  const rq = $('#c-rq');
  if (rq) rq.oninput = () => {
    const needle = rq.value.trim().toLowerCase();
    $$('#c-reg tr').forEach((tr) => {
      tr.style.display = tr.textContent.toLowerCase().includes(needle)
        ? '' : 'none';
    });
  };
  $$('[data-cedit]').forEach((b) => (b.onclick = () =>
    openCertEditor(b.dataset.cedit)));
  $$('[data-crev]').forEach((b) => (b.onclick = async () => {
    const c = state.certs.find((x) => x.number === b.dataset.crev);
    const err = await postJson('/certificates/update', {
      number: c.number,
      status: c.status === 'revoked' ? 'issued' : 'revoked',
    });
    if (err) { toast(err); return; }
    await loadAll();
    render();
  }));
  $$('[data-cdel]').forEach((b) => (b.onclick = async () => {
    if (!confirm(`Удалить запись ${b.dataset.cdel}? Номер повторно не выдаётся.`)) return;
    const err = await postJson('/certificates/delete', { number: b.dataset.cdel });
    if (err) { toast(err); return; }
    await loadAll();
    render();
  }));

  // — Поводы
  $('#c-mod-add').onclick = () => {
    $('#c-mods').insertAdjacentHTML('beforeend', certModuleRow({}));
    wireModuleRows();
  };
  $('#c-mod-save').onclick = async () => {
    const items = Array.from(document.querySelectorAll('.c-mod-row'))
      .map((tr, i) => ({
        id: state.certModules[i]?.id || `m${Date.now()}${i}`,
        label: tr.querySelector('.cm-label').value.trim(),
        template: tr.querySelector('.cm-tpl').value,
        ru: tr.querySelector('.cm-ru').value.trim(),
        ky: tr.querySelector('.cm-ky').value.trim(),
      }))
      .filter((m) => m.label);
    const err = await postJson('/cert/modules', { items });
    if (err) { toast(err); return; }
    toast('Список сохранён');
    await loadAll();
    render();
  };
  wireModuleRows();
}

function wireModuleRows() {
  document.querySelectorAll('.cm-del').forEach((b) =>
    (b.onclick = () => b.closest('tr').remove()));
}

/// Правка выданного. Номер и ученик не меняются: это уже другой документ, и
/// его надо выдавать заново, чтобы в реестре осталась история.
function openCertEditor(number) {
  const c = state.certs.find((x) => x.number === number);
  if (!c) return;
  const d = dialog(`
    <h2 style="margin:0 0 4px">${esc(c.number)}</h2>
    <p class="muted" style="margin:0 0 14px">${esc(c.student || '')} · выдан ${fmtDate(c.issuedAt)}</p>
    <label>Имя на бланке<br><input id="ce-name" style="width:100%" value="${esc(c.name || '')}"></label>
    <label>Текст повода<br><input id="ce-title" style="width:100%" value="${esc(c.title || '')}"></label>
    <div class="grid" style="gap:10px;margin-top:8px">
      <label>Бланк<br><select id="ce-tpl">${CERT_TEMPLATES.map(([id, t]) =>
        `<option value="${id}"${c.template === id ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Язык<br><select id="ce-lang">${CERT_LANGS.map(([id, t]) =>
        `<option value="${id}"${c.lang === id ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
    </div>

    <label>Подарок от<br><input id="ce-gift" style="width:100%" value="${esc(c.giftFrom || '')}"></label>
    <div class="bar" style="margin-top:14px">

      name: $('#ce-name').value.trim(),

      template: $('#ce-tpl').value,
      lang: $('#ce-lang').value,
      course: $('#ce-course').value.trim(),
      teacher: $('#ce-teacher').value.trim(),
      giftFrom: $('#ce-gift').value.trim(),
    });
    if (err) { toast(err); return; }
    d.close();
    await loadAll();

// — Коды подтверждения

/// Сколько кодов ждут выдачи прямо сейчас. Раздел обновляется сам, а
/// счётчик виден в меню: код называет человек, и пока никто не смотрит в
/// панель, ученик просто сидит перед пустым полем ввода.
function waitingCodes() {
  const now = Date.now();
  return state.codes.filter((c) => !c.used && (c.expiresAt || 0) > now).length;
}

/// Имя ученика: в записи кода оно есть только у заведённых после того, как
/// сервер начал его подставлять, — для остальных смотрим в реестр.
function codeName(c) {
  if (c.name) return c.name;
  const u = state.users.find((x) => identOf(x) === c.phone);
  return u ? (u.name || '') : '';
}

function viewCodes() {
  const s = state.support || {};
  return `<div class="card">

    ${state.codes.length ? `<table style="margin-top:10px"><thead><tr>
      <th>Телефон</th><th>Ученик</th><th>Код</th><th>Когда</th><th>Статус</th></tr></thead><tbody>

        const expired = (c.expiresAt || 0) < Date.now();
        const valid = !c.used && !expired;

          <td class="muted">${esc(codeName(c))}</td>
          <td style="font-size:20px;letter-spacing:2px">${valid ? esc(c.code) : '••••••'}</td>
          <td class="muted">${fmtDateTime(c.createdAt)}</td>
          <td>${c.used ? '<span class="tag ok">использован</span>'

      }).join('')}</tbody></table>` : '<p class="muted">Запросов пока не было.</p>'}
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Куда ученику писать за кодом</h2>
    <p class="muted">Эти контакты приложение показывает кнопками на экране

    <p style="margin-top:10px">WhatsApp (номер)<br>
      <input id="sp-wa" value="${esc(s.whatsapp || '')}"

             placeholder="Отвечаем с 9:00 до 20:00" style="max-width:520px"></p>

// — Видео и файлы

/// Чем файл открывать: браузер умеет видео, звук и картинки, остальное —
/// ссылкой.
function mediaKind(name) {
  const e = String(name).toLowerCase().split('.').pop();
  if (['mp4', 'mov', 'm4v'].includes(e)) return 'video';
  if (['mp3', 'm4a', 'aac'].includes(e)) return 'audio';
  if (['jpg', 'jpeg', 'png', 'webp'].includes(e)) return 'image';
  return 'file';
}

const folderName = (id) =>
  state.mediaFolders.find((f) => f.id === id)?.name || '';

/// Чем файл подписан: своя подпись, иначе название урока, в котором он уже
/// опубликован — такой файл подписывать вручную незачем.
const mediaLabel = (m) => m.title || m.lessonTitle || '';

  <div class="card">

  <div class="card">
    <h2>${active ? esc(active.name) : cur === '' ? 'Без папки' : 'Все файлы'}

        style="max-width:340px;margin-bottom:12px">` : ''}

                `<div class="muted">${esc(u)}</div>`).join('')
            : '<span class="muted">не привязан к уроку</span>'}</td>
      <td class="row-actions">
        <button data-play="${esc(m.name)}">▶ Смотреть</button>
        <button data-title="${esc(m.name)}">Подпись</button>
        <button data-copy="${esc(m.publicUrl || state.mediaBase + m.url)}">Ссылка</button>
        <button data-movemedia="${esc(m.name)}">В папку</button>
        <button class="danger" data-delmedia="${esc(m.name)}"
                data-used="${m.usedIn.length}">Удалить</button>
      </td>
    </tr>`).join('')}</tbody></table></div>`
      : `<p class="muted">${state.media.length

/// Просмотр прямо в панели. Ссылку берём ОТНОСИТЕЛЬНУЮ (свой origin):
/// панель открывают и по https через Tailscale, а страница по https не имеет
/// права тянуть http-адрес — браузер заблокирует как смешанный контент.
function playMedia(name) {
  const m = state.media.find((x) => x.name === name);
  if (!m) return;
  const kind = mediaKind(name);
  const src = esc(m.url);
  const body = kind === 'video'
    ? `<video src="${src}" controls autoplay playsinline preload="metadata"></video>`
    : kind === 'audio'
    ? `<audio src="${src}" controls autoplay style="width:100%"></audio>`
    : kind === 'image'
    ? `<img src="${src}" alt="">`
    : `<p class="muted">Этот файл браузер не показывает — откройте его
       по ссылке ниже.</p>`;
  const d = dialog(`
    <h2 style="margin-top:0;word-break:break-word">${esc(mediaLabel(m) || name)}</h2>
    ${body}
    <p class="muted" style="margin:10px 0 0;word-break:break-all">
      ${mediaLabel(m) ? esc(name) + ' · ' : ''}${fmtBytes(m.size)} ·
      ${fmtDateTime(m.mtime)}${m.folder ? ' · 📁 ' + esc(folderName(m.folder)) : ''}</p>
    ${m.usedIn.length ? `<p class="muted" style="margin:4px 0 0">Урок:
      ${m.usedIn.map(esc).join('; ')}</p>` : ''}
    <div class="row-actions" style="margin-top:14px">
      <button class="primary" id="pl-title">Подписать</button>
      <a href="${src}" target="_blank" rel="noopener"><button>Открыть отдельно</button></a>
      <button id="pl-close">Закрыть</button>
    </div>`);
  d.classList.add('wide');
  const media = d.querySelector('video, audio');
  // Диалог переиспользуется — без остановки звук продолжал бы играть.
  d.addEventListener('close', () => {
    if (media) { media.pause(); media.removeAttribute('src'); media.load(); }
    d.classList.remove('wide');
  }, { once: true });
  $('#pl-close').onclick = () => d.close();
  // Посмотрел — сразу подписал: ради этого связка и нужна.
  $('#pl-title').onclick = () => { d.close(); titleMedia(name); };
}

/// Подпись к файлу — то, чего не хватало: имена на диске нечитаемые
/// (транслитерация), а переименовать файл нельзя, на него ссылаются уроки.
function titleMedia(name) {
  const m = state.media.find((x) => x.name === name);
  if (!m) return;
  const d = dialog(`
    <h2 style="margin-top:0">Подпись к файлу</h2>
    <p class="muted" style="word-break:break-all">${esc(name)}</p>
    <label>Что это за видео</label>
    <input id="t-val" value="${esc(mediaLabel(m))}" maxlength="120"
           placeholder="Например: Таджвид, урок 12 — правила нун сакина">
    <p class="muted">Видна только в панели: имя файла и ссылка на урок
      не меняются.</p>
    <div class="row-actions" style="margin-top:14px">
      <button class="primary" id="t-ok">Сохранить</button>
      <button id="t-cancel">Отмена</button>
    </div>`);
  const input = $('#t-val');
  input.focus();
  input.select();
  const save = async () => {
    const title = input.value.trim();
    d.close();
    const err = await postJson('/media/title', { name, title });
    toast(err || (title ? 'Подписано' : 'Подпись убрана'));
    if (!err) { await loadAll(); render(); }
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') save(); };
  $('#t-ok').onclick = save;
  $('#t-cancel').onclick = () => d.close();
}

async function moveMedia(names, folder) {
  const err = await postJson('/media/move', { names, folder });
  toast(err || (folder ? `Перенесено в «${folderName(folder)}»`
    : 'Вынуто из папки'));
  if (!err) { mediaSel.clear(); await loadAll(); render(); }
}

async function doUpload(files) {
  const box = $('#progress');
  const folder = $('#up-folder')?.value || '';
  for (const file of files) {
    const line = document.createElement('div');
    line.className = 'bar';
    line.innerHTML = `<span class="lbl">${esc(file.name.slice(0, 14))}</span>
      <span class="track"><span class="fill" style="width:0%"></span></span>
      <span class="val">0%</span>`;
    box.appendChild(line);
    const fill = line.querySelector('.fill');
    const val = line.querySelector('.val');
    const err = await uploadFile(file, file.name, (f) => {
      fill.style.width = Math.round(f * 100) + '%';
      val.textContent = Math.round(f * 100) + '%';
    }, folder);
    val.textContent = err ? 'ошибка' : 'готово';
    if (err) { line.querySelector('.fill').style.background = 'var(--red)'; toast(err); }
  }
  await loadAll();
  render();
}

/// Диалог урока: название + ссылка, выбираемая из загруженных файлов.
function lessonDialog(lesson, onSave) {
  // Файлы группируем по папкам — с двумя сотнями уроков плоский список
  // бесполезен.
  const opt = (m) =>
    `<option value="${esc(m.publicUrl || state.mediaBase + m.url)}"
      data-cap="${esc(mediaLabel(m))}"
      >${esc(mediaLabel(m) || m.name)} · ${fmtBytes(m.size)}</option>`;
  const group = (title, list) => list.length
    ? `<optgroup label="${esc(title)}">${list.map(opt).join('')}</optgroup>` : '';
  const opts = state.mediaFolders.map((f) =>
      group(f.name, state.media.filter((m) => m.folder === f.id))).join('')
    + group('Без папки', state.media.filter((m) => !m.folder));
  dialog(`
    <h2 style="margin-top:0">${lesson ? 'Урок' : 'Новый урок'}</h2>
    <label>Название</label>
    <input id="l-title" value="${esc(lesson?.title || '')}">
    <label>Видео с сервера</label>
    <select id="l-pick"><option value="">— выбрать из загруженных —</option>${opts}</select>
    <label>Ссылка</label>
    <input id="l-url" value="${esc(lesson?.url || '')}" placeholder="https://…">
    <p class="muted">Можно выбрать загруженный файл выше или вставить внешнюю
      ссылку (MP4 или HLS-плейлист .m3u8).</p>
    <div class="row-actions" style="margin-top:14px">
      <button class="primary" id="l-ok">Сохранить</button>
      <button id="l-cancel">Отмена</button>
    </div>`);
  $('#l-pick').onchange = (e) => {
    if (!e.target.value) return;
    $('#l-url').value = e.target.value;
    // Название урока подставляем из подписи файла, если своего ещё нет.
    const t = e.target.selectedOptions[0]?.dataset.cap;
    if (t && !$('#l-title').value.trim()) $('#l-title').value = t;
  };
  $('#l-cancel').onclick = () => $('#dlg').close();
  $('#l-ok').onclick = () => {
    const title = $('#l-title').value.trim();
    const url = $('#l-url').value.trim();
    if (!title || !url) return toast('Нужны название и ссылка');
    $('#dlg').close();
    onSave({ title, url });
  };
}

// Пишем блок ОДНОГО устаза, остальные оставляем как есть: раньше файл
// переписывался целиком, и со вторым устазом это стёрло бы уроки первого.
function catalogWith(teacherId, directions, name) {
  const raw = state.coursesRaw || {};
  const blocks = Array.isArray(raw.teachers)
    ? raw.teachers.map((b) => ({ ...b }))
    : [];
  const i = blocks.findIndex((b) => b.id === teacherId);
  const block = { id: teacherId, name: name || teacherName(teacherId),
                  directions: directions || [] };
  if (i >= 0) blocks[i] = { ...blocks[i], ...block };
  else blocks.push(block);
  const out = { updated: new Date().toISOString(), teachers: blocks };
  // Старый общий блок оставляем, пока правят не его: он принадлежит устазу,
  // который ещё не публиковался по-новому.
  if (Array.isArray(raw.directions) && raw.directions.length
      && teacherId !== 'legacy') {
    out.author = raw.author;
    out.directions = raw.directions;
  }
  return out;
}

async function saveCatalog() {
  if (!state.teacherId) return toast('Сначала выберите устаза');
  const err = await putJson('/courses.json',
    catalogWith(state.teacherId, state.catalog, state.author));
  toast(err || 'Каталог опубликован студентам');
  if (!err) { await loadAll(); render(); }
}

/// Карточка одной заявки. [who] — id устаза, если заявка на каталог.
function moderationCard(kind, title, p, summary, who) {
  const st = p.status || 'none';
  const tag = st === 'pending' ? '<span class="tag warn">на модерации</span>'
    : st === 'approved' ? '<span class="tag ok">одобрено</span>'
    : st === 'rejected' ? '<span class="tag bad">отклонено</span>' : '';
  return `<div class="card">
    <h2>${title} ${tag}</h2>
    <p class="muted">Автор: ${esc(p.author || '—')} · ${fmtDateTime(Date.parse(p.submittedAt) || 0)}</p>
    <p>${esc(summary(p))}</p>
    ${(p.directions || []).map((d) => `<p class="muted">• ${esc(d.title)} (${(d.courses || []).length})</p>`).join('')}
    ${p.reason ? `<p class="muted">Причина отказа: ${esc(p.reason)}</p>` : ''}
    ${st === 'pending' ? `<div class="row-actions" style="margin-top:10px">
      <button class="primary" data-approve="${kind}" data-who="${esc(who || '')}">Одобрить и опубликовать</button>
      <button class="danger" data-reject="${kind}" data-who="${esc(who || '')}">Отклонить</button>
    </div>` : ''}
  </div>`;
}

// Одобрение = публикация в live + пометка заявки. Так же, как в приложении.
async function approve(kind, who) {
  if (kind === 'courses') return approveCourses(who);
  const p = state.pending[kind];
  const live = { news: 'news.json', azkar: 'azkar.json' }[kind];
  const payload = { updated: new Date().toISOString(), author: p.author };
  if (kind === 'news') payload.items = p.items || [];
  if (kind === 'azkar') payload.categories = p.categories || [];

  let err = await putJson('/' + live, payload);
  if (!err) {
    err = await putJson(`/${kind}_pending.json`,
      { ...p, status: 'approved', reviewedAt: new Date().toISOString() });
  }
  toast(err || 'Опубликовано студентам');
  if (!err) { await loadAll(); render(); }
}

/// Одобрение каталога: уроки уходят в блок этого устаза, а сам он становится
/// виден ученикам — иначе уроки лежали бы в каталоге, а автора не было бы
/// в списке, и открыть их стало бы неоткуда.
async function approveCourses(who) {
  const p = state.pendingCourses.find((x) => x.teacherId === who);
  if (!p) return toast('Заявка не найдена');
  let err = await putJson('/courses.json',
    catalogWith(who, p.directions || [], p.author));
  if (!err) err = await postJson('/teachers/flag', { id: who, status: 'approved' });
  if (!err) {
    err = await putJson(`/courses_pending_${who}.json`,
      { ...p, status: 'approved', reviewedAt: new Date().toISOString() });
  }
  toast(err || 'Опубликовано ученикам');
  if (!err) { await loadAll(); render(); }
}

async function reject(kind, who) {
  const reason = prompt('Причина отказа (увидит устаз):', '');
  if (reason === null) return;
  const p = kind === 'courses'
    ? state.pendingCourses.find((x) => x.teacherId === who)
    : state.pending[kind];
  if (!p) return toast('Заявка не найдена');
  const path = kind === 'courses'
    ? `/courses_pending_${who}.json`
    : `/${kind}_pending.json`;
  const err = await putJson(path,
    { ...p, status: 'rejected', reason, reviewedAt: new Date().toISOString() });
  toast(err || 'Заявка отклонена');
  if (!err) { await loadAll(); render(); }
}

    render();

    const name = prompt('Название папки:', '');
    if (!name?.trim()) return;

    if (!err) { await loadAll(); render(); }

  const fRen = $('#folder-ren');
  if (fRen) fRen.onclick = async () => {
    const cur = state.mediaFolders.find((f) => f.id === state.mediaFolder);
    const name = prompt('Название папки:', cur?.name || '');
    if (!name?.trim()) return;
    const err = await postJson('/media/folder',
      { op: 'rename', id: state.mediaFolder, name: name.trim() });
    toast(err || 'Переименовано');
    if (!err) { await loadAll(); render(); }
  };
  const fDel = $('#folder-del');
  if (fDel) fDel.onclick = async () => {
    const cur = state.mediaFolders.find((f) => f.id === state.mediaFolder);
    if (!confirm(`Удалить папку «${cur?.name}»?\n\nФайлы останутся на сервере `
      + 'и перейдут в «Без папки» — уроки продолжат работать.')) return;
    const err = await postJson('/media/folder', { op: 'delete', id: state.mediaFolder });
    toast(err || 'Папка удалена');
    if (!err) { state.mediaFolder = '*'; await loadAll(); render(); }
  };
  document.querySelectorAll('[data-movemedia]').forEach((b) => (b.onclick = () => {
    const name = b.dataset.movemedia;
    const m = state.media.find((x) => x.name === name);
    const d = dialog(`
      <h2 style="margin-top:0">Переложить файл</h2>
      <p class="muted" style="word-break:break-all">${esc(name)}</p>
      <label>Папка</label>
      <select id="mv-folder">
        <option value="">— без папки —</option>
        ${state.mediaFolders.map((f) => `<option value="${esc(f.id)}"${
          f.id === m?.folder ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}
      </select>
      <div class="row-actions" style="margin-top:14px">
        <button class="primary" id="mv-ok">Переложить</button>
        <button id="mv-cancel">Отмена</button>
      </div>`);
    $('#mv-cancel').onclick = () => d.close();
    $('#mv-ok').onclick = async () => {
      const folder = $('#mv-folder').value;
      d.close();
      await moveMedia([name], folder);
    };
  }));

  // Пачка: галочки + перенос выбранных.
  const bulk = $('#mbulk');
  if (bulk) {
    const boxes = [...document.querySelectorAll('[data-sel]')];
    const sync = () => {
      boxes.forEach((c) => (c.checked = mediaSel.has(c.dataset.sel)));
      bulk.style.display = mediaSel.size ? 'flex' : 'none';
      $('#mbulk-n').textContent = `Выбрано: ${mediaSel.size}`;
      const all = $('#msel-all');
      if (all) all.checked = boxes.length > 0 && boxes.every((c) => c.checked);
    };
    boxes.forEach((c) => (c.onchange = () => {
      if (c.checked) mediaSel.add(c.dataset.sel); else mediaSel.delete(c.dataset.sel);
      sync();
    }));
    const all = $('#msel-all');
    if (all) all.onchange = () => {
      // Отмечаем только видимые строки: поиск мог часть скрыть.
      boxes.filter((c) => c.closest('tr').style.display !== 'none').forEach((c) => {
        if (all.checked) mediaSel.add(c.dataset.sel); else mediaSel.delete(c.dataset.sel);
      });
      sync();
    };
    $('#mbulk-go').onclick = () => moveMedia([...mediaSel], $('#mbulk-folder').value);
    sync();
  }
  // Поиск прячет строки, а не перерисовывает таблицу — так не слетают
  // ни галочки, ни обработчики кнопок.
  const mq = $('#mq');
  if (mq) mq.oninput = () => {
    const q = mq.value.trim().toLowerCase();
    document.querySelectorAll('[data-row]').forEach((tr) => {
      tr.style.display = tr.dataset.row.toLowerCase().includes(q) ? '' : 'none';
    });
  };

  // — Каталог курсов
  const addDir = $('#add-dir');
  if (addDir) addDir.onclick = () => {
    const t = prompt('Название направления:', '');
    if (!t?.trim()) return;
    state.catalog.push({ title: t.trim(), courses: [] });
    render();
  };
  const saveBtn = $('#save-catalog');
  if (saveBtn) saveBtn.onclick = saveCatalog;

  document.querySelectorAll('[data-rendir]').forEach((b) => (b.onclick = () => {
    const d = state.catalog[+b.dataset.rendir];
    const t = prompt('Название направления:', d.title);
    if (t?.trim()) { d.title = t.trim(); render(); }
  }));
  document.querySelectorAll('[data-deldir]').forEach((b) => (b.onclick = () => {
    const d = state.catalog[+b.dataset.deldir];
    if (!confirm(`Удалить «${d.title}» со всеми курсами внутри?`)) return;
    state.catalog.splice(+b.dataset.deldir, 1);
    render();
  }));
  document.querySelectorAll('[data-addcourse]').forEach((b) => (b.onclick = () => {
    const t = prompt('Название курса:', '');
    if (!t?.trim()) return;
    state.catalog[+b.dataset.addcourse].courses.push(
      { title: t.trim(), subtitle: '', lessons: [] });
    render();
  }));
  document.querySelectorAll('[data-rencourse]').forEach((b) => (b.onclick = () => {
    const [di, ci] = b.dataset.rencourse.split('.').map(Number);
    const c = state.catalog[di].courses[ci];
    const t = prompt('Название курса:', c.title);
    if (!t?.trim()) return;
    const st = prompt('Подпись (можно пусто):', c.subtitle || '');
    c.title = t.trim();
    c.subtitle = (st || '').trim();
    render();
  }));
  document.querySelectorAll('[data-delcourse]').forEach((b) => (b.onclick = () => {
    const [di, ci] = b.dataset.delcourse.split('.').map(Number);
    if (!confirm(`Удалить курс «${state.catalog[di].courses[ci].title}»?`)) return;
    state.catalog[di].courses.splice(ci, 1);
    render();
  }));
  document.querySelectorAll('[data-addlesson]').forEach((b) => (b.onclick = () => {
    const [di, ci] = b.dataset.addlesson.split('.').map(Number);
    lessonDialog(null, (l) => {
      state.catalog[di].courses[ci].lessons.push(l);
      render();
    });
  }));
  document.querySelectorAll('[data-renlesson]').forEach((b) => (b.onclick = () => {
    const [di, ci, li] = b.dataset.renlesson.split('.').map(Number);
    const lessons = state.catalog[di].courses[ci].lessons;
    lessonDialog(lessons[li], (l) => { lessons[li] = l; render(); });
  }));
  document.querySelectorAll('[data-dellesson]').forEach((b) => (b.onclick = () => {
    const [di, ci, li] = b.dataset.dellesson.split('.').map(Number);
    state.catalog[di].courses[ci].lessons.splice(li, 1);
    render();
  }));

  document.querySelectorAll('[data-approve]').forEach((b) =>
    (b.onclick = () => approve(b.dataset.approve, b.dataset.who)));
  document.querySelectorAll('[data-reject]').forEach((b) =>
    (b.onclick = () => reject(b.dataset.reject, b.dataset.who)));

  const pick = $('#teacher-pick');
  if (pick) {
    pick.onchange = () => {
      const b = teacherBlocks().find((x) => x.id === pick.value);
      state.teacherId = pick.value;
      state.catalog = b ? (b.directions || []) : [];
      state.author = b ? (b.name || '') : '';
      render();
    };
  }
  document.querySelectorAll('[data-tstatus]').forEach((b) =>
    (b.onclick = async () => {
      const [id, status] = b.dataset.tstatus.split('|');
      const err = await postJson('/teachers/flag', { id, status });
      toast(err || (status === 'approved' ? 'Устаз виден ученикам'
                                          : 'Устаз скрыт от учеников'));
      if (!err) { await loadAll(); render(); }
    }));
  document.querySelectorAll('[data-tdel]').forEach((b) =>
    (b.onclick = async () => {
      if (!confirm('Удалить устаза из реестра? Уже опубликованные уроки '
                   + 'останутся в каталоге.')) return;
      const err = await postJson('/teachers/delete', { id: b.dataset.tdel });
      toast(err || 'Устаз удалён из реестра');
      if (!err) { await loadAll(); render(); }
    }));
}

// ——— Вход и запуск ——————————————————————————————————————————————

function logout() {
  auth = '';
  sessionStorage.removeItem('irfan_auth');
  $('#app').hidden = true;
  $('#login').hidden = false;
}

async function start() {
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#who').textContent = 'admin';
  await loadAll();
  render();
}

$('#lg-go').onclick = async () => {
  const user = $('#lg-user').value.trim();
  const pass = $('#lg-pass').value;
  auth = btoa(unescape(encodeURIComponent(user + ':' + pass)));
  const r = await fetch(API + '/auth/check',
    { method: 'POST', headers: { 'Authorization': 'Basic ' + auth } });
  if (!r.ok) {
    $('#lg-err').textContent = 'Неверный логин или пароль';
    auth = '';
    return;
  }
  const { role } = await r.json();
  if (role !== 'admin') {
    // Устаз сюда не заходит: панель работает с ПДн и доступами.
    $('#lg-err').textContent = 'Нужна учётная запись администратора';
    auth = '';
    return;
  }
  sessionStorage.setItem('irfan_auth', auth);
  $('#lg-err').textContent = '';
  start();
};

// Предупреждение зависит от того, как открыли панель: по HTTPS-ссылке
// Tailscale пароль защищён, по прямому IP — идёт открытым текстом.
$('#lg-note').innerHTML = location.protocol === 'https:'
  ? 'Соединение защищено — пароль передаётся в зашифрованном виде.'
  : '<b style="color:var(--orange)">Соединение без HTTPS</b> — пароль идёт '
    + 'открытым текстом. Не заходите из публичных сетей; используйте '
    + 'защищённую ссылку.';

$('#lg-pass').onkeydown = (e) => { if (e.key === 'Enter') $('#lg-go').click(); };
$('#logout').onclick = logout;
$('#reload').onclick = async () => { await loadAll(); render(); toast('Обновлено'); };

// Уже входили в этой вкладке — проверяем сохранённый пароль.
(async () => {
  if (!auth) { $('#login').hidden = false; return; }
  const r = await fetch(API + '/auth/check',
    { method: 'POST', headers: { 'Authorization': 'Basic ' + auth } });
  if (r.ok && (await r.json()).role === 'admin') start();
  else logout();
})();
</script>
